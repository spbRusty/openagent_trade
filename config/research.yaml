# research.yaml — исследовательский пайплайн: параметры и допущения (ТЗ §6-11)
# Источник истины для research-кода. Загружается config/research.py.

universe:
  min_median_turnover: 2000.0   # USD/мин, порог ликвидности
  max_symbols: 60

costs:
  # Taker: 0.055% fee + 0.02% слиппедж на сторону
  fee_taker_per_side: 0.00055
  slippage_taker_per_side: 0.0002
  # Сетка стресса: кандидат должен выживать при 0.20% как минимум
  cost_levels_round_trip: [0.0010, 0.0015, 0.0020, 0.0030]
  # Maker-сценарий (лимитки): 0.02% fee + тот же слиппедж
  maker_fee_per_side: 0.0002

backtest:
  ret_windows: [1, 3, 5, 10, 30]
  hold_bars: [1, 3, 5, 10]
  min_move: 0.0005            # минимальный |move| для сигнала (0.05%)

periods:
  # Жёсткое правило: свип параметров ТОЛЬКО на discovery.
  # Параметры фиксируются, потом смотрят validation и OOS. Возврат невозможен.
  discovery: ["2020-01-01", "2024-12-31"]
  validation: ["2025-01-01", "2025-12-31"]
  oos: ["2026-01-01", "2026-12-31"]

candidate:
  min_t: 2.0                  # критерий отбора на discovery (overlap-adjusted t)

portfolio:
  n_long: 10
  n_short: 10
  rebalance_days: 30          # месячный ребаланс