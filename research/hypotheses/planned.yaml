# Планируемые гипотезы (бэклог до формальной регистрации в registry.py).
# Формализация — только с экономическим обоснованием, ДО подглядывания в данные.
# Ограничение: маячки копятся в logs/realtime/beacons.jsonl с 2026-08-21 —
# бэктест возможен после накопления истории.

- id: H8
  name: стена→отскок
  idea: плотность-стена в топ-10 уровней → цена возвращается к цене стены за N минут
  why: курс «бага» — плотность от полумиллиона является основанием для отскока,
       первый импульсный подход без проторговки; у нас wall-маяки со size/med
  need: история маячков + минутные бары тех же символов

- id: H9
  name: дисбаланс→impulse
  idea: дисбаланс топ-10 ≥ порога → движение в сторону перевеса на M минут
  why: согласие стакана = давление крупных участников; детектор уже даёт
       strength как отношение объёмов сторон
  need: та же история маячков

- id: H10
  name: спред→режим
  idea: резкое расширение спреда (×медианы) → повышенная волатильность ближайшего часа
  why: расширение спреда маркирует уход маркетмейкеров / приход агрессии;
       пригодно как режимный фильтр для H8/H9
  need: та же история маячков
